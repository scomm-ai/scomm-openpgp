[package]
name = "scomm-openpgp-sequoia"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sequoia-openpgp backend for scomm-openpgp-core. The only crate that may depend on Sequoia."

[dependencies]
scomm-openpgp-core.workspace = true
sequoia-openpgp = { workspace = true, default-features = false, features = ["crypto-openssl"] }
anyhow = "1"
openssl-sys = { version = "0.9.114", features = ["vendored"] }
