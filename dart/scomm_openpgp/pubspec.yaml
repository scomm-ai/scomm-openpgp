name: scomm_openpgp
description: Flutter FFI for the Scomm OpenPGP SDK (Sequoia is an implementation detail).
version: 0.1.0
publish_to: none
homepage: https://github.com/scomm-ai/scomm-openpgp
repository: https://github.com/scomm-ai/scomm-openpgp

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
