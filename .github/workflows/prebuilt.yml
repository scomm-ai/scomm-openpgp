name: Prebuilt libraries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "prebuilt/**"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: scomm_openpgp.dll
          - os: windows-latest
            target: i686-pc-windows-msvc
            lib: scomm_openpgp.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            lib: scomm_openpgp.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libscomm_openpgp.so
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            lib: libscomm_openpgp.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib: libscomm_openpgp.so
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libscomm_openpgp.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libscomm_openpgp.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux cross compilers
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            i686-unknown-linux-gnu) sudo apt-get install -y gcc-i686-linux-gnu ;;
          esac
      - name: Windows ARM64 linker
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = & $vswhere -latest -find "**\Hostx64\arm64\link.exe"
          if ($found) { exit 0 }
          $install = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath $install --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart --wait
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
          CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
          AR_i686_unknown_linux_gnu: i686-linux-gnu-ar
          CFLAGS_x86_64_apple_darwin: -arch x86_64
          CC_x86_64_apple_darwin: clang
        run: cargo build --release --target ${{ matrix.target }} -p scomm-openpgp-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  android:
    name: android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: nttld-ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.nttld-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.nttld-ndk.outputs.ndk-path }}
        run: cargo build --release --target ${{ matrix.target }} -p scomm-openpgp-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libscomm_openpgp.so
          if-no-files-found: error

  ios:
    name: ios ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            sdk: iphoneos
          - target: aarch64-apple-ios-sim
            sdk: iphonesimulator
          - target: x86_64-apple-ios
            sdk: iphonesimulator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          export SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          cargo build --release --target ${{ matrix.target }} -p scomm-openpgp-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libscomm_openpgp.dylib
          if-no-files-found: error

  publish:
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: prebuilt
      - name: Commit libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilt
          if git diff --cached --quiet; then
            echo "Prebuilt libraries are unchanged."
            exit 0
          fi
          git commit -m "Publish prebuilt OpenPGP libraries for desktop, Android, and iOS. [skip ci]"
          git push origin HEAD:main
