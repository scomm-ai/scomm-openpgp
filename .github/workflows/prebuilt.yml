name: Prebuilt libraries

on:
  workflow_dispatch:
    inputs:
      android:
        description: Comma-separated Android triples. Empty skips Android.
        required: false
        default: ""
        type: string
      desktop:
        description: JSON array of desktop {os,target,lib} rows. Empty skips desktop.
        required: false
        default: ""
        type: string
      ios:
        description: JSON array of iOS {target,sdk} rows. Empty skips iOS.
        required: false
        default: ""
        type: string
      reuse_run:
        description: Run id whose artifacts fill triples that this run did not build.
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "prebuilt/**"

permissions:
  contents: write
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.out.outputs.android }}
      desktop: ${{ steps.out.outputs.desktop }}
      ios: ${{ steps.out.outputs.ios }}
    steps:
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          SKIP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]') }}
          ANDROID_IN: ${{ inputs.android }}
          DESKTOP_IN: ${{ inputs.desktop }}
          IOS_IN: ${{ inputs.ios }}
        run: |
          python3 << 'PY'
          import json, os
          event = os.environ["EVENT"]
          skip = os.environ["SKIP"] == "true"
          android_all = [
              "aarch64-linux-android",
              "armv7-linux-androideabi",
              "x86_64-linux-android",
              "i686-linux-android",
          ]
          desktop_all = [
              {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "lib": "scomm_openpgp.dll"},
              {"os": "windows-latest", "target": "i686-pc-windows-msvc", "lib": "scomm_openpgp.dll"},
              {"os": "windows-latest", "target": "aarch64-pc-windows-msvc", "lib": "scomm_openpgp.dll"},
              {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "lib": "libscomm_openpgp.so"},
              {"os": "ubuntu-latest", "target": "i686-unknown-linux-gnu", "lib": "libscomm_openpgp.so"},
              {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu", "lib": "libscomm_openpgp.so"},
              {"os": "macos-latest", "target": "aarch64-apple-darwin", "lib": "libscomm_openpgp.dylib"},
              {"os": "macos-latest", "target": "x86_64-apple-darwin", "lib": "libscomm_openpgp.dylib"},
          ]
          ios_all = [
              {"target": "aarch64-apple-ios", "sdk": "iphoneos"},
              {"target": "aarch64-apple-ios-sim", "sdk": "iphonesimulator"},
              {"target": "x86_64-apple-ios", "sdk": "iphonesimulator"},
          ]
          if event == "workflow_dispatch":
              raw = os.environ["ANDROID_IN"].strip()
              android = [part.strip() for part in raw.split(",") if part.strip()]
              desktop = json.loads(os.environ["DESKTOP_IN"]) if os.environ["DESKTOP_IN"].strip() else []
              ios = json.loads(os.environ["IOS_IN"]) if os.environ["IOS_IN"].strip() else []
          elif skip:
              android, desktop, ios = [], [], []
          else:
              android, desktop, ios = android_all, desktop_all, ios_all
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"android={json.dumps(android)}\n")
              out.write(f"desktop={json.dumps(desktop)}\n")
              out.write(f"ios={json.dumps(ios)}\n")
          PY
  desktop:
    name: ${{ matrix.target }}
    needs: select
    if: needs.select.outputs.desktop != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.desktop) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux cross compilers
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            i686-unknown-linux-gnu) sudo apt-get install -y gcc-i686-linux-gnu ;;
          esac
      - name: Windows ARM64 linker
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = & $vswhere -latest -find "**\Hostx64\arm64\link.exe"
          if ($found) { exit 0 }
          $install = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath $install --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart --wait
      - name: Windows Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) {
            choco install strawberryperl -y
          }
          # Git Bash perl cannot load OpenSSL's Configure modules.
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
          CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
          AR_i686_unknown_linux_gnu: i686-linux-gnu-ar
          CFLAGS_x86_64_apple_darwin: -arch x86_64
          CC_x86_64_apple_darwin: clang
        run: cargo build --release --target ${{ matrix.target }} -p scomm-openpgp-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  android:
    name: android ${{ matrix.target }}
    needs: select
    if: needs.select.outputs.android != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.android) }}
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: nttld-ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Put NDK clang on PATH
        env:
          ANDROID_NDK_ROOT: ${{ steps.nttld-ndk.outputs.ndk-path }}
        run: |
          bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api=21
          ln -sfn "$bin/aarch64-linux-android${api}-clang" "$bin/aarch64-linux-android-clang"
          ln -sfn "$bin/armv7a-linux-androideabi${api}-clang" "$bin/armv7a-linux-androideabi-clang"
          ln -sfn "$bin/armv7a-linux-androideabi${api}-clang" "$bin/armv7-linux-androideabi-clang"
          ln -sfn "$bin/armv7a-linux-androideabi${api}-clang" "$bin/arm-linux-androideabi-clang"
          ln -sfn "$bin/i686-linux-android${api}-clang" "$bin/i686-linux-android-clang"
          ln -sfn "$bin/x86_64-linux-android${api}-clang" "$bin/x86_64-linux-android-clang"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.nttld-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.nttld-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: armv7-linux-androideabi-clang
          CARGO_TARGET_I686_LINUX_ANDROID_LINKER: i686-linux-android-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: x86_64-linux-android-clang
          AR_aarch64_linux_android: llvm-ar
          AR_armv7_linux_androideabi: llvm-ar
          AR_i686_linux_android: llvm-ar
          AR_x86_64_linux_android: llvm-ar
        run: cargo build --release --target ${{ matrix.target }} -p scomm-openpgp-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libscomm_openpgp.so
          if-no-files-found: error

  ios:
    name: ios ${{ matrix.target }}
    needs: select
    if: needs.select.outputs.ios != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.ios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          export SDKROOT="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          cargo build --release --target ${{ matrix.target }} -p scomm-openpgp-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libscomm_openpgp.dylib
          if-no-files-found: error

  package-ios-xcframework:
    name: ios xcframework
    needs: [select, ios]
    if: needs.select.outputs.ios != '[]'
    runs-on: macos-latest
    steps:
      - name: Download iOS dylibs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-apple-ios*"
          path: ios-dylibs
      - name: Wrap device and simulator slices
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/openpgp-xcframework"
          rm -rf "$work"
          mkdir -p "$work/ios-arm64" "$work/ios-arm64_x86_64-simulator" "$work/sim"

          make_framework() {
            local src="$1"
            local dest_parent="$2"
            local platform="$3"
            local fw="$dest_parent/libscomm_openpgp.framework"
            rm -rf "$fw"
            mkdir -p "$fw"
            cp "$src" "$fw/libscomm_openpgp"
            chmod +x "$fw/libscomm_openpgp"
            install_name_tool -id "@rpath/libscomm_openpgp.framework/libscomm_openpgp" "$fw/libscomm_openpgp"
            python3 -c 'import pathlib,sys; p,plat=sys.argv[1],sys.argv[2]; pathlib.Path(p).write_text("""<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>libscomm_openpgp</string>
              <key>CFBundleIdentifier</key>
              <string>ai.scomm.openpgp</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>libscomm_openpgp</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                <string>%s</string>
              </array>
            </dict>
            </plist>
            """ % plat)' "$fw/Info.plist" "$platform"
            codesign --force --sign - --timestamp=none "$fw"
          }

          device="ios-dylibs/aarch64-apple-ios/libscomm_openpgp.dylib"
          sim_arm="ios-dylibs/aarch64-apple-ios-sim/libscomm_openpgp.dylib"
          sim_x64="ios-dylibs/x86_64-apple-ios/libscomm_openpgp.dylib"
          test -f "$device"
          test -f "$sim_arm"
          test -f "$sim_x64"
          lipo -create "$sim_arm" "$sim_x64" -output "$work/sim/libscomm_openpgp.dylib"
          make_framework "$device" "$work/ios-arm64" "iPhoneOS"
          make_framework "$work/sim/libscomm_openpgp.dylib" "$work/ios-arm64_x86_64-simulator" "iPhoneSimulator"
          xcodebuild -create-xcframework \
            -framework "$work/ios-arm64/libscomm_openpgp.framework" \
            -framework "$work/ios-arm64_x86_64-simulator/libscomm_openpgp.framework" \
            -output "$work/libscomm_openpgp.xcframework"
          cp -R "$work/libscomm_openpgp.xcframework" "$RUNNER_TEMP/libscomm_openpgp.xcframework"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: ${{ runner.temp }}/libscomm_openpgp.xcframework
          if-no-files-found: error

  publish:
    needs: [desktop, android, ios, package-ios-xcframework]
    if: >-
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: prebuilt
        continue-on-error: true
      - name: Fill gaps from an earlier run
        if: inputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=',' read -ra runs <<< "${{ inputs.reuse_run }}"
          for run_id in "${runs[@]}"; do
            run_id="${run_id// /}"
            [ -z "$run_id" ] && continue
            rm -rf /tmp/reuse
            gh run download "$run_id" --repo "${{ github.repository }}" --dir /tmp/reuse
            shopt -s nullglob
            for dir in /tmp/reuse/*; do
              name="$(basename "$dir")"
              mkdir -p "prebuilt/$name"
              if [ -z "$(ls -A "prebuilt/$name")" ]; then
                cp -a "$dir"/. "prebuilt/$name/"
              fi
            done
          done
      - name: Commit libraries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          framework_dest="dart/scomm_openpgp/ios/scomm_openpgp/Frameworks/libscomm_openpgp.xcframework"
          if [ -d prebuilt/ios-xcframework/libscomm_openpgp.xcframework ]; then
            rm -rf "$framework_dest"
            mkdir -p dart/scomm_openpgp/ios/scomm_openpgp/Frameworks
            mv prebuilt/ios-xcframework/libscomm_openpgp.xcframework "$framework_dest"
            rm -rf prebuilt/ios-xcframework
          elif [ -d prebuilt/ios-xcframework/ios-arm64 ] || [ -f prebuilt/ios-xcframework/Info.plist ]; then
            rm -rf "$framework_dest"
            mkdir -p dart/scomm_openpgp/ios/scomm_openpgp/Frameworks
            mv prebuilt/ios-xcframework "$framework_dest"
          fi
          if [ -d "$framework_dest" ]; then
            rm -rf prebuilt/aarch64-apple-ios prebuilt/aarch64-apple-ios-sim prebuilt/x86_64-apple-ios
          fi
          git add prebuilt
          if [ -d dart/scomm_openpgp/ios/scomm_openpgp/Frameworks ]; then
            git add dart/scomm_openpgp/ios/scomm_openpgp/Frameworks
          fi
          if git diff --cached --quiet; then
            echo "Prebuilt libraries are unchanged."
            exit 0
          fi
          git commit -m "Publish prebuilt OpenPGP libraries for desktop, Android, and iOS. [skip ci]"
          git push origin HEAD:main
